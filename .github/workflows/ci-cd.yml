name: Book Worm Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write

env:
  AWS_REGION: ap-south-1
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ============================================================================
  # Stage 1: Build & Unit Tests
  # ============================================================================
  build-and-unit-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile and Run Unit Tests
        run: |
          mvn clean test \
            -Dtest="*Test,!*IntegrationTest" \
            -B

      - name: Publish Unit Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

  # ============================================================================
  # Stage 2: Integration Tests (PostgreSQL Testcontainers)
  # ============================================================================
  integration-test:
    name: Integration Tests
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run Integration Tests with Testcontainers
        run: |
          mvn test \
            -Dtest="*IntegrationTest" \
            -B

      - name: Publish Integration Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

  # ============================================================================
  # Stage 3: SonarQube / SonarCloud Code Quality & SAST
  # ============================================================================
  sonar-analysis:
    name: SonarQube Code Quality & SAST Scan
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache SonarCloud Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Execute SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=book-worm-backend \
            -Dsonar.organization=bookworm \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -DskipTests=true \
            -B

  # ============================================================================
  # Stage 4: Docker Build & Push to Amazon ECR
  # ============================================================================
  build-and-push-ecr:
    name: Docker Build & Push to ECR
    needs: sonar-analysis
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
      target_env: ${{ steps.set-env.outputs.target_env }}
      ecr_repository: ${{ steps.set-env.outputs.ecr_repository }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Environment & Tag
        id: set-env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "target_env=prod" >> $GITHUB_OUTPUT
            echo "ecr_repository=book-worm-backend-prod" >> $GITHUB_OUTPUT
          else
            echo "target_env=dev" >> $GITHUB_OUTPUT
            echo "ecr_repository=book-worm-backend-dev" >> $GITHUB_OUTPUT
          fi

      - name: Generate Semantic Image Tag
        id: set-tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_TAG="${{ steps.set-env.outputs.target_env }}-${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ steps.set-env.outputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
        run: |
          docker build \
            --tag ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG} \
            --tag ${REGISTRY}/${REPOSITORY}:latest \
            .
          
          docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${REPOSITORY}:latest

  # ============================================================================
  # Stage 5: Deploy to AWS App Runner & Health Verification
  # ============================================================================
  deploy-to-app-runner:
    name: Deploy to AWS App Runner
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build-and-push-ecr.outputs.target_env }}
      url: ${{ steps.get-url.outputs.service_url }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger App Runner Deployment
        id: apprunner-deploy
        env:
          SERVICE_NAME: "book-worm-backend-${{ needs.build-and-push-ecr.outputs.target_env }}"
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --region ${{ env.AWS_REGION }} \
            --query "ServiceSummaryList[?ServiceName=='${SERVICE_NAME}'].ServiceArn | [0]" \
            --output text)
          
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" == "None" ]; then
            echo "::error::App Runner service '${SERVICE_NAME}' not found."
            exit 1
          fi
          
          echo "Starting App Runner deployment for ARN: ${SERVICE_ARN}..."
          OPERATION_ID=$(aws apprunner start-deployment \
            --service-arn "${SERVICE_ARN}" \
            --region ${{ env.AWS_REGION }} \
            --query "OperationId" \
            --output text)
          
          echo "Deployment started with OperationId: ${OPERATION_ID}"
          echo "service_arn=${SERVICE_ARN}" >> $GITHUB_OUTPUT
          echo "operation_id=${OPERATION_ID}" >> $GITHUB_OUTPUT

      - name: Poll Deployment Status & Actuator Health Check
        id: health-check
        env:
          SERVICE_ARN: ${{ steps.apprunner-deploy.outputs.service_arn }}
          OPERATION_ID: ${{ steps.apprunner-deploy.outputs.operation_id }}
        run: |
          echo "Waiting for App Runner deployment to complete..."
          for i in {1..30}; do
            STATUS=$(aws apprunner describe-service \
              --service-arn "${SERVICE_ARN}" \
              --region ${{ env.AWS_REGION }} \
              --query "Service.Status" \
              --output text)
            
            echo "Current App Runner status: ${STATUS} (attempt $i/30)"
            if [ "$STATUS" == "RUNNING" ]; then
              echo "App Runner service is RUNNING."
              break
            elif [ "$STATUS" == "OPERATION_IN_PROGRESS" ]; then
              sleep 15
            else
              echo "::error::App Runner entered unexpected status: ${STATUS}"
              exit 1
            fi
          done

          # Fetch service URL
          SERVICE_URL="https://$(aws apprunner describe-service \
            --service-arn "${SERVICE_ARN}" \
            --region ${{ env.AWS_REGION }} \
            --query "Service.ServiceUrl" \
            --output text)"
          
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "Verifying health endpoint: ${SERVICE_URL}/actuator/health/readiness"
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/actuator/health/readiness" || true)
          echo "Readiness probe returned HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check failed with HTTP ${HTTP_CODE} on ${SERVICE_URL}"
            exit 1
          fi
          echo "Health check succeeded with HTTP 200 OK!"

      - name: Capture Output URL
        id: get-url
        run: |
          echo "service_url=${{ steps.health-check.outputs.service_url }}" >> $GITHUB_OUTPUT
